<aside class="hidden md:flex fixed inset-y-0 left-0 w-56 z-30 bg-bg-secondary/80 backdrop-blur-xl border-r border-border">
  <div class="h-full flex flex-col px-3 py-4">
    <!-- Brand -->
    <div class="flex items-center gap-2 px-2 pb-3 mb-2 border-b border-white/10">
      <svg width="24" height="24" viewBox="0 0 40 40" fill="none" class="text-white">
        <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
        <path d="M20 8L24 16L32 20L24 24L20 32L16 24L8 20L16 16L20 8Z" fill="currentColor"/>
      </svg>
      <span class="text-sm font-semibold text-white">LuminRank</span>
    </div>

    <!-- Nav Items -->
    <nav class="flex-1 space-y-1">
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="text-white bg-white/10"
         class="group block -mx-3 px-5 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-white/5 rounded-none" data-testid="side-home">
        <div class="flex items-center gap-2">
          <span class="h-1.5 w-1.5 rounded-full bg-transparent group-[.router-link-active]:bg-emerald-400"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v8h-5v-5H11v5H6v-8H3z"/></svg>
          <span>Home</span>
        </div>
      </a>
      <a routerLink="/leagues" routerLinkActive="text-white bg-white/10"
         class="group block -mx-3 px-5 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-white/5 rounded-none" data-testid="side-leagues">
        <div class="flex items-center gap-2">
          <span class="h-1.5 w-1.5 rounded-full bg-transparent group-[.router-link-active]:bg-emerald-400"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10h10v2H7zm0 4h10v2H7zM5 6h14v2H5z"/></svg>
          <span>Leagues</span>
        </div>
      </a>
      <a routerLink="/profile" routerLinkActive="text-white bg-white/10"
         class="group block -mx-3 px-5 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-white/5 rounded-none" data-testid="side-profile">
        <div class="flex items-center gap-2">
          <span class="h-1.5 w-1.5 rounded-full bg-transparent group-[.router-link-active]:bg-emerald-400"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></svg>
          <span>Profile</span>
        </div>
      </a>
    </nav>

    <!-- Footer -->
    <div class="mt-auto px-2 pt-2 text-[10px] text-gray-500">v1 • Compact UI</div>
  </div>
</aside>
