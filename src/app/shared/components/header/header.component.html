<nav class="sticky top-0 z-40 bg-bg-primary/40 backdrop-blur supports-[backdrop-filter]:bg-bg-primary/30 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <div 
        routerLink="/" 
        class="flex items-center gap-2 cursor-pointer group">
        <svg width="32" height="32" viewBox="0 0 40 40" fill="none" class="text-white transition-transform duration-200 group-hover:scale-110">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
          <path d="M20 8L24 16L32 20L24 24L20 32L16 24L8 20L16 16L20 8Z" fill="currentColor"/>
          </svg>
        <span class="text-xl font-bold text-white hidden sm:inline">LuminRank</span>
      </div>

      <!-- Navigation Buttons -->
      <div class="flex items-center gap-4">
        @if (!isAuthenticated()) {
          <button 
            routerLink="/auth"
            class="group relative overflow-hidden px-3 py-1.5 text-sm rounded-md border border-emerald-400/40 text-white transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-400/40"
            aria-label="Get Started">
            <span class="absolute inset-0 -z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-gradient-to-r from-emerald-400/20 via-cyan-400/20 to-emerald-400/20"></span>
            <span class="mr-1 inline-block h-2 w-2 rounded-full bg-emerald-400 group-hover:animate-pulse"></span>
            Get Started
            <span class="ml-1 inline-block transition-transform duration-200 group-hover:translate-x-0.5">→</span>
          </button>
        } @else {
          <!-- Burger Menu Dropdown -->
          <div class="relative" #dropdown>
            <button
              (click)="toggleDropdown($event)"
              class="flex items-center gap-2 px-3 py-2 rounded-lg border border-white/10 hover:bg-white/5 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-400/40"
              aria-label="Menu">
              <!-- Burger Icon -->
              <div class="flex flex-col gap-1.5 w-5">
                <span class="block h-0.5 w-full bg-white transition-all duration-300"
                      [class.rotate-45]="isDropdownOpen()"
                      [class.translate-y-2]="isDropdownOpen()"></span>
                <span class="block h-0.5 w-full bg-white transition-all duration-300"
                      [class.opacity-0]="isDropdownOpen()"></span>
                <span class="block h-0.5 w-full bg-white transition-all duration-300"
                      [class.-rotate-45]="isDropdownOpen()"
                      [class.-translate-y-2]="isDropdownOpen()"></span>
              </div>
            </button>

            <!-- Dropdown Menu -->
            @if (isDropdownOpen()) {
              <div class="absolute right-0 mt-2 w-48 bg-bg-secondary border border-white/10 rounded-lg shadow-xl backdrop-blur-xl py-2 z-50"
                   #dropdownMenu>
                <!-- User Info -->
                @if (user(); as currentUser) {
                  <div class="px-4 py-3 border-b border-white/10">
                    @if (currentUser.name) {
                      <p class="text-sm font-medium text-white">{{ currentUser.name }}</p>
                    }
                    @if (currentUser.email) {
                      <p class="text-xs text-gray-400 mt-0.5">{{ currentUser.email }}</p>
                    }
                  </div>
                }

                <!-- Menu Items -->
                <div class="py-1">
                  <button
                    (click)="navigateToProfile()"
                    class="w-full px-4 py-2 text-left text-sm text-gray-300 hover:bg-white/5 hover:text-white transition-colors flex items-center gap-2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
                    </svg>
                    Profile
                  </button>
                  <button
                    (click)="onSignOut()"
                    class="w-full px-4 py-2 text-left text-sm text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors flex items-center gap-2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                    Sign Out
                  </button>
                </div>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </div>
</nav>
