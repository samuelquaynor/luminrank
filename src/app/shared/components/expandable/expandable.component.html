<div class="bg-white/5 border border-white/10 rounded-lg overflow-hidden">
  <!-- Header -->
  <div class="w-full px-4 py-3 flex items-center justify-between hover:bg-white/5 transition-colors"
       [attr.data-testid]="'expandable-' + title()"
       [class.cursor-pointer]="!routerLink()"
       [attr.role]="routerLink() ? null : 'button'"
       (click)="!routerLink() && toggle()">
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <!-- Title (Clickable link if routerLink provided, otherwise just text) -->
      @if (routerLink()) {
        <a [routerLink]="routerLink()" 
           class="flex-1 min-w-0 text-white text-sm font-medium truncate hover:text-emerald-400 transition-colors">
          {{ title() }}
        </a>
      } @else {
        <div class="flex-1 min-w-0">
          <div class="text-white text-sm font-medium truncate">{{ title() }}</div>
        </div>
      }

      <!-- Badge -->
      @if (badge() && expanded) {
        <span class="text-[10px] px-2 py-0.5 rounded mr-2"
              [class.bg-blue-400/10]="badgeColor() === 'blue'"
              [class.text-blue-300]="badgeColor() === 'blue'"
              [class.border-blue-400/20]="badgeColor() === 'blue'"
              [class.border]="badgeColor() === 'blue'"
              [class.bg-emerald-400/10]="badgeColor() === 'green'"
              [class.text-emerald-300]="badgeColor() === 'green'"
              [class.border-emerald-400/20]="badgeColor() === 'green'"
              [class.border]="badgeColor() === 'green'">
          {{ badge() }}
        </span>
      }

      <!-- Dropdown Arrow (Toggle Button) -->
      <button
        type="button"
        (click)="$event.stopPropagation(); $event.preventDefault(); toggle()"
        class="p-1 hover:bg-white/5 rounded transition-colors flex-shrink-0 cursor-pointer"
        aria-label="Toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" 
             class="text-gray-400 transition-transform duration-200"
             [class.rotate-180]="expanded">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Content (Expanded) -->
  @if (expanded) {
    <div class="border-t border-white/10 bg-white/2">
      @if (loading()) {
        <div class="px-4 py-6 text-center">
          <div class="inline-block animate-spin h-5 w-5 border-2 border-emerald-400 border-t-transparent rounded-full"></div>
          <p class="text-xs text-gray-400 mt-2">Loading...</p>
        </div>
      } @else {
        <ng-content></ng-content>
      }
    </div>
  }
</div>
